<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="style.css"></head>
<body>
<div class="container">
<h2>Cadastro de Paciente</h2>

<h3>Dados pessoais</h3>

<input id="nome" placeholder="Nome completo">
<input id="documento" placeholder="CPF">
<input id="rg" placeholder="RG">
<input id="datadenascimento" type="date">

<select id="sexo">
  <option value="">Sexo</option>
  <option>Masculino</option>
  <option>Feminino</option>
  <option>Outro</option>
  <option>Não informado</option>
</select>

<input id="nomemae" placeholder="Nome completo da mãe">

<select id="estadocivil">
  <option value="">Estado civil</option>
  <option>Solteiro(a)</option>
  <option>Casado(a)</option>
  <option>Divorciado(a)</option>
  <option>Viúvo(a)</option>
  <option>União estável</option>
</select>


<h3>Endereço e contato</h3>

<input id="endereco" placeholder="Endereço completo">
<input id="telefone" placeholder="Telefone">
<input id="email" type="email" placeholder="E-mail">


<h3>Contato de emergência</h3>

<input id="contatoemergencia" placeholder="Nome do contato de emergência">
<input id="telefoneemergencia" placeholder="Telefone do contato de emergência">
<input id="parentesco" placeholder="Grau de parentesco">


<h3>Dados do atendimento</h3>

<select id="tipo">
  <option value="">Tipo de atendimento</option>
  <option>Convênio</option>
  <option>Particular</option>
  <option>SUS</option>
</select>

<input id="convenio" placeholder="Nome do convênio (se houver)">
<input id="numerocarteirinha" placeholder="Número da carteirinha">

<h3>Identificação</h3>

<input type="file" id="foto" accept="image/*">

<button onclick="cadastrar()">Cadastrar paciente</button>
</div>

<script>
function cadastrar(){
 fetch("http://localhost:3000/atendimento",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body: JSON.stringify({
    nome: nome.value,
    documento: documento.value,
    rg: rg.value,
    datadenascimento: datadenascimento.value,
    sexo: sexo.value,
    nomemae: nomemae.value,
    estadocivil: estadocivil.value,
    endereco: endereco.value,
    telefone: telefone.value,
    email: email.value,
    contatoemergencia: contatoemergencia.value,
    telefoneemergencia: telefoneemergencia.value,
    parentesco: parentesco.value,
    tipo: tipo.value,
    convenio: convenio.value,
    numerocarteirinha: numerocarteirinha.value
  })
 });

 alert("Paciente cadastrado e enviado para triagem");
}
</script>
</body>
</html>
