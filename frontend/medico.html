```html
<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="css/style.css">

  <!-- Biblioteca para gerar PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    .btn-tv {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px;
    }

    .btn-tv:hover {
      background: #1e7e34;
    }

    .btn-abrir-tv {
      background: #17a2b8;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-abrir-tv:hover {
      background: #117a8b;
    }

    .consultorio-input {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      background: #f0f4ff;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #d0d8f0;
    }

    .consultorio-input label {
      font-weight: bold;
    }

    .consultorio-input input {
      width: 60px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* Área da alta */
    .alta-area {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }

    .btn-alta {
      width: 100%;
      background: #198754;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
    }

    .btn-alta:hover {
      background: #146c43;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- Cabeçalho -->
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2 style="margin:0;">🩺 Painel Médico</h2>

    <button
      class="btn-abrir-tv"
      onclick="window.open('tv.html','_blank')"
    >
      📺 Abrir Tela da TV
    </button>
  </div>

  <!-- Consultório -->
  <div class="consultorio-input">
    <label>Meu Consultório:</label>

    <input
      type="text"
      id="consultorio-num"
      value="01"
    >

    <span style="color:#666; font-size:13px;">
      Este número será exibido na TV ao chamar o paciente.
    </span>
  </div>

  <!-- TRIAGENS -->
  <div id="triagens"></div>

  <hr>

  <!-- CONSULTA -->
  <h3>Consulta</h3>

  <input
    id="paciente"
    placeholder="Paciente"
    readonly
  >

  <input
    id="diagnostico"
    placeholder="Diagnóstico"
  >

  <select id="medicacao">
    <option value="">Selecione a medicação</option>
  </select>

  <textarea
    id="obs"
    placeholder="Observações"
  ></textarea>

  <button onclick="salvar()">
    💾 Salvar Consulta
  </button>

  <!-- ALTA -->
  <div class="alta-area">

    <h3>🏠 Alta do Paciente</h3>

    <p style="color:#666; font-size:13px;">
      Após finalizar a consulta, clique abaixo para gerar o documento de alta em PDF.
    </p>

    <button
      class="btn-alta"
      onclick="darAlta()"
    >
      🏠 Dar Alta e Gerar PDF
    </button>

  </div>

</div>

<script>

let triagensCarregadas = [];


/* =====================================================
   CARREGAR TRIAGENS
===================================================== */

function carregar() {

  fetch("/triagens")
    .then(r => r.json())
    .then(data => {

      triagensCarregadas = data;

      const div = document.getElementById("triagens");

      div.innerHTML = "";

      if (data.length === 0) {

        div.innerHTML =
          "<p style='color:#888; text-align:center;'>Nenhum paciente na fila.</p>";

        return;
      }

      data.forEach((t, index) => {

        div.innerHTML += `

          <div class="card">

            <h3>${t.nome}</h3>

            <p>
              <b>Sintoma:</b>
              ${t.sintoma || "Não informado"}
            </p>

            <p>
              <b>Temperatura:</b>
              ${t.temperatura || "Não informada"}°C
            </p>

            <p>
              <span class="${t.risco}">
                ${t.risco}
              </span>
            </p>

            <p>
              <b>Alergia:</b>
              ${t.alergia || "Nenhuma"}
            </p>

            <p>
              <b>Observação:</b>
              ${t.observacao || "Nenhuma"}
            </p>

            <div style="display:flex; gap:8px; flex-wrap:wrap;">

              <button onclick="selecionar(${index})">
                Atender
              </button>

              <button
                class="btn-tv"
                onclick="chamarNaTV('${t.nome}')"
              >
                📺 Chamar na TV
              </button>

            </div>

          </div>

        `;

      });

    });

}


/* =====================================================
   CHAMAR NA TV
===================================================== */

function chamarNaTV(nome) {

  const consultorio =
    document.getElementById("consultorio-num").value || "01";

  fetch("/tv/chamar", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      localTipo: "CONSULTÓRIO",
      localNumero: consultorio,
      paciente: nome

    })

  })

  .then(r => r.json())

  .then(() => {

    alert(
      "✅ " +
      nome +
      " foi chamado na TV para o Consultório " +
      consultorio +
      "!"
    );

  });

}


/* =====================================================
   SELECIONAR PACIENTE
===================================================== */

function selecionar(index) {

  const t = triagensCarregadas[index];

  document.getElementById("paciente").value =
    t.nome;

  document.getElementById("obs").value =
    t.observacao || "";

  if (t.alergia && t.alergia !== "Nenhuma") {

    alert(
      "⚠️ Paciente possui alergia: " +
      t.alergia
    );

  }

}


/* =====================================================
   CARREGAR MEDICAÇÕES
===================================================== */

function carregarMedicacoes() {

  fetch("/lista-medicacoes")

    .then(r => r.json())

    .then(data => {

      const select =
        document.getElementById("medicacao");

      select.innerHTML =
        `<option value="">Selecione a medicação</option>`;

      data.forEach(med => {

        const option =
          document.createElement("option");

        option.value = med;

        option.textContent = med;

        select.appendChild(option);

      });

    });

}


/* =====================================================
   SALVAR CONSULTA
===================================================== */

function salvar() {

  const paciente =
    document.getElementById("paciente").value;

  const diagnostico =
    document.getElementById("diagnostico").value;

  const medicacao =
    document.getElementById("medicacao").value;

  const obs =
    document.getElementById("obs").value;


  if (!paciente) {

    alert(
      "Selecione um paciente clicando em Atender."
    );

    return;
  }


  if (!medicacao) {

    alert(
      "Selecione uma medicação."
    );

    return;
  }


  fetch("/consulta", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      paciente,
      diagnostico,
      medicacao,
      obs

    })

  })

  .then(r => r.json())

  .then(() => {

    alert("✅ Consulta salva!");

  });

}


/* =====================================================
   DAR ALTA + GERAR PDF
===================================================== */

function darAlta() {

  const paciente =
    document.getElementById("paciente").value;

  const diagnostico =
    document.getElementById("diagnostico").value;

  const medicacao =
    document.getElementById("medicacao").value;

  const obs =
    document.getElementById("obs").value;


  /* Verifica paciente */

  if (!paciente) {

    alert(
      "⚠️ Selecione um paciente primeiro."
    );

    return;
  }


  /* Verifica diagnóstico */

  if (!diagnostico) {

    alert(
      "⚠️ Informe o diagnóstico antes de dar alta."
    );

    return;
  }


  /* Confirmação */

  const confirmar = confirm(

    "Deseja dar alta para " +
    paciente +
    "?"

  );


  if (!confirmar) return;


  /* =================================================
     DATA E HORA DA ALTA
  ================================================= */

  const agora = new Date();

  const dataAtual =
    agora.toLocaleDateString("pt-BR");

  const horaAtual =
    agora.toLocaleTimeString("pt-BR", {
      hour: "2-digit",
      minute: "2-digit"
    });


  /* =================================================
     GERAÇÃO DO PDF
  ================================================= */

  const { jsPDF } = window.jspdf;

  const doc = new jsPDF();


  /* Cabeçalho */

  doc.setFontSize(20);

  doc.text(
    "SISTEMA HOSPITALAR",
    105,
    25,
    { align: "center" }
  );


  doc.setFontSize(16);

  doc.text(
    "DOCUMENTO DE ALTA",
    105,
    36,
    { align: "center" }
  );


  /* Linha */

  doc.line(
    20,
    43,
    190,
    43
  );


  /* Dados */

  doc.setFontSize(12);

  let y = 60;


  /* Paciente */

  doc.setFont(undefined, "bold");

  doc.text(
    "Paciente:",
    20,
    y
  );

  doc.setFont(undefined, "normal");

  doc.text(
    paciente,
    55,
    y
  );


  y += 15;


  /* Diagnóstico */

  doc.setFont(undefined, "bold");

  doc.text(
    "Diagnóstico:",
    20,
    y
  );

  doc.setFont(undefined, "normal");

  const linhasDiagnostico =
    doc.splitTextToSize(
      diagnostico,
      135
    );

  doc.text(
    linhasDiagnostico,
    55,
    y
  );

  y +=
    Math.max(linhasDiagnostico.length, 1) * 7 +
    8;


  /* Medicação */

  doc.setFont(undefined, "bold");

  doc.text(
    "Medicação:",
    20,
    y
  );

  doc.setFont(undefined, "normal");

  doc.text(
    medicacao || "Nenhuma",
    55,
    y
  );


  y += 15;


  /* Observações */

  doc.setFont(undefined, "bold");

  doc.text(
    "Observações:",
    20,
    y
  );

  y += 8;

  doc.setFont(undefined, "normal");

  const linhasObs =
    doc.splitTextToSize(
      obs || "Nenhuma",
      170
    );

  doc.text(
    linhasObs,
    20,
    y
  );


  y +=
    linhasObs.length * 7 +
    20;


  /* Data */

  doc.setFont(undefined, "bold");

  doc.text(
    "Data da alta:",
    20,
    y
  );

  doc.setFont(undefined, "normal");

  doc.text(
    dataAtual,
    55,
    y
  );


  y += 10;


  /* Hora */

  doc.setFont(undefined, "bold");

  doc.text(
    "Hora da alta:",
    20,
    y
  );

  doc.setFont(undefined, "normal");

  doc.text(
    horaAtual,
    55,
    y
  );


  /* Assinatura */

  y += 35;

  doc.line(
    60,
    y,
    150,
    y
  );

  doc.text(
    "Médico responsável",
    105,
    y + 7,
    { align: "center" }
  );


  /* =================================================
     NOME DO ARQUIVO
  ================================================= */

  const nomeArquivo =
    "alta-" +
    paciente
      .replace(/[^a-zA-Z0-9]/g, "-")
      .toLowerCase() +
    ".pdf";


  /* Gera o PDF */

  doc.save(nomeArquivo);


  /* =================================================
     LIMPAR FORMULÁRIO
  ================================================= */

  document.getElementById("paciente").value = "";

  document.getElementById("diagnostico").value = "";

  document.getElementById("medicacao").value = "";

  document.getElementById("obs").value = "";


  /* Atualiza fila */

  carregar();


  alert(
    "🏠 Alta realizada!\n\n" +
    "O documento de alta foi gerado em PDF."
  );

}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

carregar();

carregarMedicacoes();


/* Atualiza lista automaticamente */

setInterval(
  carregar,
  10000
);

</script>

</body>
</html>
```
